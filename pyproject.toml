[tool.poetry]
name = "mr-swede"
version = "2.0.0"
description = "A Swiss-army-knife Discord bot for Overwatch stats, music streaming, and more"
authors = ["Jonathan Lee"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
# Discord
"discord.py" = {extras = ["voice"], version = "^2.3.2"}
# Web framework for Cloud Run health checks
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
# API clients
aiohttp = "^3.9.1"
httpx = "^0.26.0"
# Google Cloud
google-cloud-secret-manager = "^2.18.0"
google-cloud-firestore = "^2.14.0"
# Spotify
spotipy = "^2.23.0"
# YouTube/Audio
yt-dlp = "^2024.1.0"
PyNaCl = "^1.5.0"
# Configuration
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
# Utilities
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-bdd = "^7.0.1"
hypothesis = "^6.92.0"
ruff = "^0.1.13"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
factory-boy = "^3.3.0"
aioresponses = "^0.7.6"
freezegun = "^1.4.0"

[tool.poetry.scripts]
mr-swede = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "acceptance: Acceptance tests (ATDD)",
    "slow: Slow running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

