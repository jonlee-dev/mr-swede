# Static docker-compose for the Valheim dedicated server.
#
# Two env files are layered:
#   /etc/valheim/world.env  -- SERVER_NAME, WORLD_NAME (written by the
#                              startup-script, later mutated by the bot
#                              when switching worlds)
#   /etc/valheim/secret.env -- SERVER_PASS (fetched at boot from Secret
#                              Manager by valheim-fetch-secrets.service;
#                              0600 root:root, never committed)
#
# /opt/valheim/data is the persistent disk mount. The lloesche image owns
# the world layout under /config; backups land under /config/backups.
#
# Note on status: lloesche has a STATUS_HTTP feature that exposes a
# /status.json with join code + player count, BUT it's an A2S wrapper
# under the hood and Valheim's crossplay/PlayFab transport doesn't
# respond to legacy Steam A2S queries reliably. We instead run a
# host-level log-scraping daemon (server/scripts/status-server.py)
# that listens on host:9001/status.json. The lloesche STATUS_HTTP
# feature stays disabled (its default) so it doesn't compete for the
# port and doesn't burn CPU on doomed A2S probes.

services:
  valheim:
    image: lloesche/valheim-server:latest
    container_name: valheim
    restart: unless-stopped
    stop_grace_period: 2m
    cap_add:
      - SYS_NICE
    ports:
      - "2456-2458:2456-2458/udp"
    env_file:
      - /etc/valheim/world.env
      - /etc/valheim/secret.env
    environment:
      SERVER_PUBLIC: "true"
      CROSSPLAY: "true"
      BACKUPS_CRON: "0 */2 * * *"
      BACKUPS_MAX_AGE: "3"
      BACKUPS_DIRECTORY: /config/backups
      UPDATE_CRON: "0 5 * * *"
      RESTART_IF_IDLE_FOR: "" # idle policy lives in the bot, not the container
    volumes:
      - /opt/valheim/data:/config
