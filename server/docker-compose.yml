# Static docker-compose for the Valheim dedicated server.
#
# Two env files are layered:
#   /etc/valheim/world.env  -- SERVER_NAME, WORLD_NAME (written by the
#                              startup-script, later mutated by the bot
#                              when switching worlds)
#   /etc/valheim/secret.env -- SERVER_PASS (fetched at boot from Secret
#                              Manager by valheim-fetch-secrets.service;
#                              0600 root:root, never committed)
#
# /opt/valheim/data is the persistent disk mount. The lloesche image owns
# the world layout under /config; backups land under /config/backups.
#
# Note on status: lloesche has a STATUS_HTTP feature that exposes a
# /status.json with join code + player count, BUT it's an A2S wrapper
# under the hood and Valheim's crossplay/PlayFab transport doesn't
# respond to legacy Steam A2S queries reliably. We instead run a
# host-level log-scraping daemon (server/scripts/status-server.py)
# that listens on host:9001/status.json. The lloesche STATUS_HTTP
# feature stays disabled (its default) so it doesn't compete for the
# port and doesn't burn CPU on doomed A2S probes.

services:
  valheim:
    image: lloesche/valheim-server:latest
    container_name: valheim
    restart: unless-stopped
    stop_grace_period: 2m
    cap_add:
      - SYS_NICE
    ports:
      - "2456-2458:2456-2458/udp"
    env_file:
      - /etc/valheim/world.env
      - /etc/valheim/secret.env
    environment:
      SERVER_PUBLIC: "true"
      # Crossplay disabled. Reason captured here because TF applies hide
      # the "why" once the diff scrolls off:
      #
      # PlayFab's relay (the crossplay backbone) routes traffic through
      # Microsoft's Azure North-Central-US edge (visible in the server's
      # log lines as `*.cloudapp.azure.com`). When the relay session
      # invalidates (PlayFab code 4098), the server does a full
      # ResetParty -> Leave -> Clean -> Init -> JoinParty cycle which
      # takes ~20s and stalls all players. Direct Steam P2P has no such
      # middlebox; we accept the loss of Xbox/Game Pass crossplay (none
      # of our friend group uses those) in exchange for stable latency.
      #
      # Flip back to "true" if a non-Steam client ever needs to join.
      # Saves are unaffected -- the .db/.fwl world file format is
      # identical between modes.
      CROSSPLAY: "false"

      # BepInEx + mods. lloesche's image auto-installs the BepInEx pack
      # itself when this is true; we drop additional mod .dlls under
      # /config/bepinex/{plugins,patchers} via a oneshot systemd unit
      # (install-mods.service) that runs before this container starts.
      # See server/scripts/install-mods.sh for what gets installed.
      #
      # 2026-09-09: TEMPORARILY DISABLED for the Valheim 1.0 launch.
      # Jotunn 2.29.x (latest on Thunderstore is 2.29.2, Jul 2026 --
      # pre-1.0) throws in Jotunn.Utils.GameVersions.GetNetworkVersion()
      # during ZNet_RPC_ServerHandshake on 1.0, which makes the server
      # reject EVERY client connection (modded or not). No 1.0-compatible
      # Jotunn has shipped yet. Running vanilla 1.0 so the server is
      # joinable; flip back to "true" once Jotunn releases a 1.0 build
      # AND install-mods.sh is bumped to it (clients must match). The
      # mod .dlls + install-mods + PRE_SERVER_RUN_HOOK stay in place and
      # are simply inert while this is false, so re-enabling is one edit.
      BEPINEX: "false"

      # Mod boot-race fix (2026-09-09). lloesche rebuilds the active
      # BepInEx dir on every container start via an atomic `mv
      # bepinex.tmp bepinex`. After a Valheim *update* boot the freshly
      # built plugins/ AND patchers/ come up EMPTY, so mods silently
      # fail to load until a second restart -- the 1.0 update hit this
      # exactly (`0 plugins to load` on first boot). On later boots
      # lloesche re-syncs plugins/ from /config but NEVER patchers/.
      #
      # This hook runs inside valheim-server right AFTER the merge/mv and
      # right BEFORE the server binary launches, so it is immune to the
      # mv that orphaned the old bind-mount attempt (see volumes note).
      # It copies both dirs from the persistent disk into the active
      # BepInEx dir. Result: mods load on the FIRST boot after any
      # update/reboot. `mkdir -p` first because the active subdirs may
      # not exist yet at hook-fire time.
      #
      # Scope: this fixes plugin/patcher *presence*. PlanBuild still
      # loads client-side only -- HookGenPatcher 0.0.4 does not generate
      # MMHOOK_assembly_valheim under BepInEx 5.4.2350 (it lands in
      # patchers/ now but emits nothing), so PlanBuild's server-side
      # Awake still throws. Same limitation accepted 2026-05-03; verified
      # still true on Valheim 1.0. Blueprints work client-side.
      PRE_SERVER_RUN_HOOK: "mkdir -p /opt/valheim/bepinex/BepInEx/patchers /opt/valheim/bepinex/BepInEx/plugins; cp -f /config/bepinex/patchers/*.dll /opt/valheim/bepinex/BepInEx/patchers/ 2>/dev/null || true; cp -f /config/bepinex/plugins/*.dll /opt/valheim/bepinex/BepInEx/plugins/ 2>/dev/null || true"

      # World modifiers (Valheim CLI flag -modifier <name> <value>).
      # `portals casual` lets metals (copper, tin, iron, silver, black
      # metal) travel through portals -- removes the original-game
      # restriction. Other modifiers can be added space-separated:
      #   "-modifier portals casual -modifier resources more"
      SERVER_ARGS: "-modifier portals casual -modifier raids none"

      BACKUPS_CRON: "0 */2 * * *"
      BACKUPS_MAX_AGE: "3"
      BACKUPS_DIRECTORY: /config/backups

      # Auto-update of the Valheim binary is DISABLED so a Valheim
      # patch can't break the BepInEx mods we install. The mod authors
      # typically take 1-3 days to ship a compatibility update; keeping
      # the binary pinned avoids a "server won't boot, players angry"
      # window. To take a Valheim update: SSH in, `docker compose down`,
      # re-enable the cron temporarily OR run `steamcmd app_update 896660
      # validate` directly inside the container, then `up` again.
      UPDATE_CRON: ""

      RESTART_IF_IDLE_FOR: "" # idle policy lives in the bot, not the container
    volumes:
      - /opt/valheim/data:/config
      # NOTE on BepInEx patchers: lloesche's image only auto-syncs
      # /config/bepinex/plugins/ to the active BepInEx dir; it does NOT
      # sync /config/bepinex/patchers/. A bind-mount fails because
      # lloesche's merge does an atomic `mv bepinex.tmp bepinex` that
      # orphans the mount. As of 2026-09-09 we sync BOTH dirs via
      # PRE_SERVER_RUN_HOOK above (runs after that mv), so patchers/ is
      # now populated on every boot -- no custom Dockerfile needed.
      #
      # PlanBuild still runs plugin-only (blueprints work client-side,
      # Jotunn handles RPC bridging). Its server-side hooks need
      # HookGenPatcher to emit MMHOOK_assembly_valheim, which 0.0.4 does
      # not do under BepInEx 5.4.2350 even when loaded. Revisit if a
      # HookGenPatcher build compatible with this BepInEx ships, or if
      # PlanBuild drops the separate-patcher requirement.
