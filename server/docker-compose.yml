# Static docker-compose for the Valheim dedicated server.
#
# Two env files are layered:
#   /etc/valheim/world.env  -- SERVER_NAME, WORLD_NAME (written by the
#                              startup-script, later mutated by the bot
#                              when switching worlds)
#   /etc/valheim/secret.env -- SERVER_PASS (fetched at boot from Secret
#                              Manager by valheim-fetch-secrets.service;
#                              0600 root:root, never committed)
#
# /opt/valheim/data is the persistent disk mount. The lloesche image owns
# the world layout under /config; backups land under /config/backups.
#
# Note on status: lloesche has a STATUS_HTTP feature that exposes a
# /status.json with join code + player count, BUT it's an A2S wrapper
# under the hood and Valheim's crossplay/PlayFab transport doesn't
# respond to legacy Steam A2S queries reliably. We instead run a
# host-level log-scraping daemon (server/scripts/status-server.py)
# that listens on host:9001/status.json. The lloesche STATUS_HTTP
# feature stays disabled (its default) so it doesn't compete for the
# port and doesn't burn CPU on doomed A2S probes.

services:
  valheim:
    image: lloesche/valheim-server:latest
    container_name: valheim
    restart: unless-stopped
    stop_grace_period: 2m
    cap_add:
      - SYS_NICE
    ports:
      - "2456-2458:2456-2458/udp"
    env_file:
      - /etc/valheim/world.env
      - /etc/valheim/secret.env
    environment:
      SERVER_PUBLIC: "true"
      # Crossplay disabled. Reason captured here because TF applies hide
      # the "why" once the diff scrolls off:
      #
      # PlayFab's relay (the crossplay backbone) routes traffic through
      # Microsoft's Azure North-Central-US edge (visible in the server's
      # log lines as `*.cloudapp.azure.com`). When the relay session
      # invalidates (PlayFab code 4098), the server does a full
      # ResetParty -> Leave -> Clean -> Init -> JoinParty cycle which
      # takes ~20s and stalls all players. Direct Steam P2P has no such
      # middlebox; we accept the loss of Xbox/Game Pass crossplay (none
      # of our friend group uses those) in exchange for stable latency.
      #
      # Flip back to "true" if a non-Steam client ever needs to join.
      # Saves are unaffected -- the .db/.fwl world file format is
      # identical between modes.
      CROSSPLAY: "false"

      # BepInEx + mods. lloesche's image auto-installs the BepInEx pack
      # itself when this is true; we drop additional mod .dlls under
      # /config/bepinex/{plugins,patchers} via a oneshot systemd unit
      # (install-mods.service) that runs before this container starts.
      # See server/scripts/install-mods.sh for what gets installed.
      BEPINEX: "true"

      # World modifiers (Valheim CLI flag -modifier <name> <value>).
      # `portals casual` lets metals (copper, tin, iron, silver, black
      # metal) travel through portals -- removes the original-game
      # restriction. Other modifiers can be added space-separated:
      #   "-modifier portals casual -modifier resources more"
      SERVER_ARGS: "-modifier portals casual"

      BACKUPS_CRON: "0 */2 * * *"
      BACKUPS_MAX_AGE: "3"
      BACKUPS_DIRECTORY: /config/backups

      # Auto-update of the Valheim binary is DISABLED so a Valheim
      # patch can't break the BepInEx mods we install. The mod authors
      # typically take 1-3 days to ship a compatibility update; keeping
      # the binary pinned avoids a "server won't boot, players angry"
      # window. To take a Valheim update: SSH in, `docker compose down`,
      # re-enable the cron temporarily OR run `steamcmd app_update 896660
      # validate` directly inside the container, then `up` again.
      UPDATE_CRON: ""

      RESTART_IF_IDLE_FOR: "" # idle policy lives in the bot, not the container
    volumes:
      - /opt/valheim/data:/config
      # NOTE on BepInEx patchers: lloesche's image only auto-syncs
      # /config/bepinex/plugins/ to the active BepInEx dir; it does
      # NOT sync /config/bepinex/patchers/. We tried bind-mounting our
      # host patchers dir into the container's active patchers path
      # but lloesche's `merge_mod` does an atomic `mv bepinex.tmp
      # bepinex` which orphans the bind mount (the new bepinex/ has
      # no mount, the .old/ retains it). PlanBuild requires the
      # HookGenPatcher patcher and its server-side marketplace
      # depends on it loading; without that we run with PlanBuild's
      # plugin partially loaded and Jotunn handling RPC bridging.
      #
      # Operational decision (2026-05-03): accept the limitation.
      # Friend group is small, blueprints work fine client-side,
      # and the marketplace is non-essential. install-mods.sh still
      # downloads HookGenPatcher (it's a documented PlanBuild dep)
      # so if we ever switch to a custom Dockerfile that wires
      # patchers in correctly, no other change is needed.
