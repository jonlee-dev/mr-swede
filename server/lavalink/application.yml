# Lavalink v4 server configuration.
#
# Spring Boot resolves ${ENV_VAR} placeholders at JVM start from the
# container's environment. The Lavalink password lands here via the
# fetch-secrets oneshot writing /etc/lavalink/secret.env, which
# lavalink.service loads via EnvironmentFile=. Same for the Spotify
# credentials when present.
#
# Plugins:
#   - youtube-plugin: replaces Lavalink's built-in YouTube source
#     (deprecated when YouTube changed their API); tracks upstream.
#   - lavasrc: resolves Spotify track/playlist/album URLs (requires a
#     Spotify Developer App; credentials seeded via GSM at
#     spotify-client-credentials). Lavasrc looks up the metadata, then
#     falls back to YouTube via the youtube-plugin for actual audio.
#     Disabled cleanly when credentials aren't present.

server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      # Disable built-in YouTube source -- broken upstream; we use the
      # community plugin instead.
      youtube: false
      bandcamp: true
      soundcloud: false
      twitch: false
      vimeo: false
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: true
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    # Cap how many tracks a YouTube playlist URL can resolve to. 100
    # comfortably covers normal user-curated playlists; tracks beyond
    # are surfaced to the user as a "truncated" warning by the bot.
    # Spotify playlists/albums are capped separately under
    # plugins.lavasrc.spotify.* below.
    youtubePlaylistLoadLimit: 100
    # Tightened from 5s -> 1s on 2026-05-13 so the bot's voice-health
    # heartbeat (in bot/src/cogs/music.py) has a 1s-fresh signal to
    # compare consecutive samples against. Costs nothing at hobby scale:
    # one playerUpdate per second per active player on a localhost
    # link. Also unblocks a smoother "now-playing" progress widget in
    # a future PR (see PRD decision log 2026-05-13).
    playerUpdateInterval: 1
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: false
    gc-warnings: true

  plugins:
    # Bumped 1.13.5 -> 1.18.1 on 2026-05-09 after observing tracks
    # cutting out within 12-13 seconds. Lavalink's startup banner
    # printed: "YOUTUBE-SOURCE VERSION 1.18.1 AVAILABLE / Update to
    # ensure the YouTube source remains operational!" -- YouTube
    # periodically breaks older versions of the unofficial plugin
    # (bot-detection / API changes), and the symptom is exactly what
    # we saw: SOME tracks play normally, others get cut after a few
    # seconds depending on which video format YouTube is willing to
    # serve. Bumping to the version the banner suggests is the
    # canonical fix.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    # lavasrc: Spotify URL resolution. Pinned to a 4.x stable release
    # known to work against Lavalink 4.2.x. Bumping it should be a
    # deliberate change with a smoke-test pass (Spotify track URL,
    # playlist URL, album URL) -- Spotify's API contract is the
    # surface lavasrc adapts.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.4.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # OAuth (below) is the durable anti-bot bypass. ONLY the `TV` client
    # supports OAuth (per the youtube-source compatibility matrix), so
    # it goes FIRST -- authenticated requests get the best resilience
    # to YouTube's "requires login" rejections. The rest are unauthenticated
    # fallbacks for cases where TV can't serve a specific format (TV
    # doesn't return Opus, so MUSIC / ANDROID_MUSIC / IOS / WEB cover
    # search results and any track TV won't decode). 2026-05-25 incident:
    # WEB + WEB_EMBEDDED_PLAYER + ANDROID_VR all started failing simultaneously,
    # which is why OAuth is essential rather than aspirational.
    # TVHTML5_SIMPLY_EMBEDDED_PLAYER from the earlier attempt was silently
    # dropped by the plugin ("Failed to resolve into a Client") -- it's
    # not a recognized identifier in 1.18.1.
    clients:
      - TV
      - MUSIC
      - ANDROID_MUSIC
      - IOS
      - WEB
    # YouTube OAuth -- authenticates as a real Google user (burner
    # account; see runbook scenario 20) so anti-bot doesn't reject our
    # requests. The refresh token lives in GSM (lavalink-youtube-oauth-token)
    # and is loaded into LAVALINK_OAUTH_REFRESH_TOKEN by fetch-secrets.sh
    # at boot. On the FIRST boot before the operator has seeded a
    # token, refreshToken expands to empty string AND we leave
    # skipInitialization false (Spring default), so the plugin enters
    # device-code mode, prints a URL + code to the journal, and waits
    # for the operator to complete the dance. Once the token is seeded
    # via gcloud secrets versions add, subsequent boots load it
    # silently with no human in the loop.
    oauth:
      enabled: ${LAVALINK_OAUTH_ENABLED:false}
      refreshToken: "${LAVALINK_OAUTH_REFRESH_TOKEN:}"
    # Remote signature-cipher service. As of 2026-05-25, YouTube's player
    # JS changed shape and youtube-source's local cipher-extraction regex
    # ("Must find sig function from script") no longer matches; OAuth
    # alone doesn't help because the failure is in URL deciphering,
    # not authentication. yt-cipher (https://github.com/kikkia/yt-cipher)
    # is a Deno service that wraps yt-dlp/ejs and exposes a REST API
    # for sig deciphering, kept fresh by its maintainer. We point at
    # the public instance to start; if rate-limits become a problem
    # (>1000 active players) or we want to remove the SPOF, self-hosting
    # is a docker-compose-one-liner -- see runbook 22.
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "mr-swede"

  lavasrc:
    # When lavasrc resolves a Spotify track to metadata, it then
    # searches YouTube for the actual audio (Spotify itself doesn't
    # expose stream-able audio outside its own apps). The %ISRC%
    # provider is a stronger match (matches the recording, not just
    # the title); falls back to a plain title search.
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      # Toggled by fetch-secrets.sh based on whether the Spotify
      # credentials secret is seeded. False = lavasrc still loads but
      # rejects Spotify URLs cleanly; the bot surfaces a fail-clean
      # error to the user.
      spotify: ${LAVASRC_SPOTIFY_ENABLED:false}
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      # We use the youtube-plugin (above) for YouTube; lavasrc's
      # built-in YouTube source would conflict.
      youtube: false
    spotify:
      # Empty defaults are safe: when LAVASRC_SPOTIFY_ENABLED=false
      # lavasrc never tries to authenticate. Spring's ${VAR:default}
      # syntax keeps Lavalink booting even when the env vars aren't
      # set at all.
      clientId: "${LAVASRC_SPOTIFY_CLIENT_ID:}"
      clientSecret: "${LAVASRC_SPOTIFY_CLIENT_SECRET:}"
      # ISO-3166 country code that gates which catalog Spotify returns.
      # US gives the broadest coverage for our friend group; can be
      # overridden via env if needed.
      countryCode: "${LAVASRC_SPOTIFY_COUNTRY:US}"
      # Same 100-track cap as youtubePlaylistLoadLimit so the bot's
      # PLAYLIST_TRACK_CAP stays the only place that ever rejects
      # tracks for being too many.
      playlistLoadLimit: 100
      albumLoadLimit: 100

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 30
