[tool.poetry]
name = "mr-swede"
version = "4.0.0"
description = "Discord-controlled Valheim server (start/stop/status)"
authors = ["Jonathan Lee"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
# ^3.11 admits both 3.11 (Debian 12's stock Python, used on the
# bot-vm) and 3.12 (the python:3.12-slim image we used on Cloud Run
# and the GitHub Actions CI runner). 2026-05-10 migration: the VM
# rendered "3.12 not available" since Debian 12 ships 3.11 and
# installing a newer Python is non-trivial; the bot doesn't use
# any 3.12-only syntax so the version floor moves down to 3.11.
python = "^3.11"
# Discord with voice extras (PyNaCl). Even though Lavalink streams the
# actual audio frames to Discord, discord.py's voice handshake still
# requires PyNaCl to encrypt the voice gateway negotiation. Without
# it, `await voice_channel.connect(cls=wavelink.Player)` fails with
# "PyNaCl is not installed, voice will NOT be supported."
"discord.py" = {extras = ["voice"], version = "^2.3.2"}
# HTTP server for Cloud Run health checks
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
# Google Cloud
google-cloud-secret-manager = "^2.18.0"
# Configuration
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
# Logging
structlog = "^24.1.0"
google-cloud-compute = "^1.19.0"
# httpx is already pulled in transitively by FastAPI, but pin it
# explicitly because /valheim status uses it directly to fetch
# /status.json from the VM's log-scraping daemon.
httpx = "^0.27.0"
# Lavalink client. Wavelink is the discord.py-aligned, smaller-surface
# choice (vs Pomice / Mafic). Drives the music feature.
#
# Pinned to 3.5+ because Lavalink 4.2 requires a `channelId` field in
# the voice-state PATCH (and the rest of the DAVE/E2EE protocol),
# which Wavelink 3.5.1 added. 3.4.x sends an old voice payload that
# Lavalink 4.2 rejects with HTTP 400.
wavelink = "^3.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
ruff = "^0.1.13"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
freezegun = "^1.4.0"

[tool.poetry.scripts]
mr-swede = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line-length handled by formatter
    # discord.py event handlers and FastAPI handlers are signature-defined;
    # the `app` / `signum` / `frame` etc. arguments aren't always used in the body
    # but they MUST appear in the signature for the framework to call us.
    "ARG001",
    "ARG002",
]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.mypy]
# Lowest supported version (per tool.poetry.dependencies). mypy uses
# this to gate features available on the target Python, so checking
# against 3.11 catches any 3.12-only syntax that would break the
# bot-vm's stock Debian Python. CI still runs the actual tests on
# 3.12 so we get coverage on both versions.
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
