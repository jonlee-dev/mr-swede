[tool.poetry]
name = "mr-swede"
version = "4.0.0"
description = "Discord-controlled Valheim server (start/stop/status)"
authors = ["Jonathan Lee"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
# Discord (no voice extras: we don't play audio)
"discord.py" = "^2.3.2"
# HTTP server for Cloud Run health checks
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
# Google Cloud
google-cloud-secret-manager = "^2.18.0"
# Configuration
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
# Logging
structlog = "^24.1.0"
google-cloud-compute = "^1.19.0"
# httpx is already pulled in transitively by FastAPI, but pin it
# explicitly because /valheim status uses it directly to fetch
# /status.json from the VM's log-scraping daemon.
httpx = "^0.27.0"
# Lavalink client. Wavelink is the discord.py-aligned, smaller-surface
# choice (vs Pomice / Mafic). Drives the music feature.
wavelink = "^3.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
ruff = "^0.1.13"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
freezegun = "^1.4.0"

[tool.poetry.scripts]
mr-swede = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line-length handled by formatter
    # discord.py event handlers and FastAPI handlers are signature-defined;
    # the `app` / `signum` / `frame` etc. arguments aren't always used in the body
    # but they MUST appear in the signature for the framework to call us.
    "ARG001",
    "ARG002",
]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
